# Experiment Configuration
experiment_name: "default_experiment"
seed: 42
device: "cuda" # "cuda", "cpu", or "mps"

# Model Architecture
model:
  input_dim: 784        # e.g., MNIST 28x28
  hidden_dims: [128, 64]
  output_dim: 10
  dropout: 0.2

# Dataset Configuration
data:
  dataset_name: "synthetic_mnist"
  batch_size: 64
  num_workers: 0
  train_val_split: 0.8

# Training Hyperparameters
training:
  epochs: 5
  learning_rate: 0.001
  weight_decay: 0.0001
  val_every_n_epochs: 1
  save_dir: "models"
  log_interval: 10
