# Demand Forecasting Model Configuration (Phase 2.1)
experiment_name: "demand_forecasting_v1"
seed: 42

data:
  processed_csv: "data/processed/demand_forecasting_features.csv"
  target_column: "target_label"
  train_val_split: 0.8 # Chronological split

model:
  n_estimators: 500
  max_depth: 5
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  early_stopping_rounds: 30
  eval_metric: "rmse"

output:
  model_dir: "models"
  model_name: "demand_forecasting.json"
  evaluation_report_name: "demand_forecasting_eval.json"
  feature_importance_name: "demand_forecasting_importance.png"
