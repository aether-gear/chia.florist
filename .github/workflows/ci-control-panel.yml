# Chia Florist — CI/CD: control-panel (React + Vite)
# Primary deployment: Netlify (static site)
#
# Secrets required:
#   NETLIFY_AUTH_TOKEN   — Netlify personal access token
#   NETLIFY_SITE_ID      — Netlify site ID (production)
#   NETLIFY_SITE_ID_STG  — Netlify site ID (staging)

name: CI — control-panel

on:
  push:
    branches:
      - main
    paths:
      - 'control-panel/**'
      - '.github/workflows/ci-control-panel.yml'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
    paths:
      - 'control-panel/**'

jobs:

  # --- Lint + Type Check + Build --- #
  build:
    name: Build (Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: control-panel/package-lock.json

      - name: Install dependencies
        working-directory: control-panel
        run: npm ci

      - name: Type check
        working-directory: control-panel
        run: npx tsc --noEmit

      - name: Lint
        working-directory: control-panel
        run: npm run lint

      - name: Build (production)
        working-directory: control-panel
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ github.ref == 'refs/heads/staging' && 'https://api.staging.chia.florist' || 'https://api.chia.florist' }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: control-panel-dist
          path: control-panel/dist
          retention-days: 1

  # --- Deploy to Netlify (production) --- #
  deploy-production:
    name: Deploy → Netlify Production
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://panel.chia.florist
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: control-panel-dist
          path: dist

      - name: Deploy to Netlify
        uses: netlify/actions/cli@master
        with:
          args: deploy --dir=dist --prod --message "${{ github.event.head_commit.message }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID:    ${{ secrets.NETLIFY_SITE_ID }}

  # --- Deploy to Netlify (staging) --- #
  deploy-staging:
    name: Deploy → Netlify Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://panel.staging.chia.florist
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: control-panel/package-lock.json

      - name: Install dependencies
        working-directory: control-panel
        run: npm ci

      - name: Build (staging)
        working-directory: control-panel
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.staging.chia.florist

      - name: Deploy to Netlify (staging)
        uses: netlify/actions/cli@master
        with:
          args: deploy --dir=control-panel/dist --prod --message "staging: ${{ github.event.head_commit.message }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID:    ${{ secrets.NETLIFY_SITE_ID_STG }}