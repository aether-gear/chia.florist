# Chia Florist — CI/CD: e-commerce (Nuxt 4)
#
# Secrets required:
#   RAILWAY_TOKEN
#   RAILWAY_ECOMMERCE_PROD_ID
#   RAILWAY_ECOMMERCE_STG_ID

name: CI — e-commerce

on:
  push:
    branches:
      - main
    paths:
      - 'e-commerce/**'
      - '.github/workflows/ci-e-commerce.yml'
    tags:
      - 'e-commerce-v*'
  pull_request:
    branches:
      - main
    paths:
      - 'e-commerce/**'

env:
  REGISTRY:   ghcr.io
  IMAGE_NAME: ${{ github.repository }}/e-commerce

jobs:

  # --- Build check --- #
  build-check:
    name: Build Check (Nuxt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: e-commerce
        run: bun install --frozen-lockfile

      - name: Type check
        working-directory: e-commerce
        run: bun run nuxt prepare

  # --- Build & Push Docker Image --- #
  build-push:
    name: Build & Push (Docker)
    runs-on: ubuntu-latest
    needs: build-check
    if: |
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/staging' ||
      startsWith(github.ref, 'refs/tags/e-commerce-v')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=match,pattern=e-commerce-v(.*),group=1
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/staging' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context:    ./e-commerce
          push:       true
          tags:       ${{ steps.meta.outputs.tags }}
          labels:     ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

