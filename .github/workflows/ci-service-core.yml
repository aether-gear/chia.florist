# Chia Florist — CI/CD: service-core (Go)
#
# Triggers:
#   - push to main or staging branches (when service-core/** changes)
#   - push of v* semver tags (triggers versioned release build)
#   - pull_request to main or staging
#
# Secrets required (GitHub repo secrets):
#   RAILWAY_TOKEN                — Railway CLI token
#   RAILWAY_SERVICE_CORE_PROD_ID — Railway service ID for production
#   RAILWAY_SERVICE_CORE_STG_ID  — Railway service ID for staging

name: CI — service-core

on:
  push:
    branches:
      - main
    paths:
      - 'service-core/**'
      - '.github/workflows/ci-service-core.yml'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
    paths:
      - 'service-core/**'

env:
  REGISTRY:   ghcr.io
  IMAGE_NAME: ${{ github.repository }}/service-core

jobs:

  # --- Test --- #
  test:
    name: Test (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file:      service-core/go.mod
          cache-dependency-path: service-core/go.sum

      - name: Vet
        working-directory: service-core
        run: go vet ./...

      - name: Test
        working-directory: service-core
        run: go test -race -coverprofile=coverage.out ./internal/...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: service-core-coverage
          path: service-core/coverage.out

  # --- Build & Push Docker Image --- #
  build-push:
    name: Build & Push (Docker)
    runs-on: ubuntu-latest
    needs: test
    if: |
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/staging' ||
      startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/staging' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context:   ./service-core
          push:      true
          tags:      ${{ steps.meta.outputs.tags }}
          labels:    ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # --- Deploy to Railway (production) --- #
  deploy-production:
    name: Deploy → Railway Production
    runs-on: ubuntu-latest
    needs: build-push
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://api.chia.florist
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy service-core to Railway (production)
        working-directory: service-core
        run: railway up --service ${{ secrets.RAILWAY_SERVICE_CORE_PROD_ID }} --environment production --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # --- Deploy to Railway (staging) --- #
  deploy-staging:
    name: Deploy → Railway Staging
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://api.staging.chia.florist
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy service-core to Railway (staging)
        working-directory: service-core
        run: railway up --service ${{ secrets.RAILWAY_SERVICE_CORE_STG_ID }} --environment staging --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}