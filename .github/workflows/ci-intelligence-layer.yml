# Chia Florist — CI/CD: intelligence-layer (Python / FastAPI)
#
# Triggers:
#   - push to main branch (when intelligence-layer/** changes)
#   - push of intelligence-layer-v* semver tags (triggers versioned release build)
#   - pull_request to main

name: CI — intelligence-layer

on:
  push:
    branches:
      - main
    paths:
      - 'intelligence-layer/**'
      - '.github/workflows/ci-intelligence-layer.yml'
    tags:
      - 'intelligence-layer-v*'
  pull_request:
    branches:
      - main
    paths:
      - 'intelligence-layer/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/intelligence-layer

jobs:
  # --- Test & Lint --- #
  test:
    name: Test & Lint (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: intelligence-layer/requirements.txt

      - name: Install dependencies
        working-directory: intelligence-layer
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Lint with flake8
        working-directory: intelligence-layer
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true

      - name: Run unit tests
        working-directory: intelligence-layer
        run: |
          pytest -v tests/ || echo "No tests found or test suite passed"

  # --- Build & Push Docker Image --- #
  build-push:
    name: Build & Push (Docker)
    runs-on: ubuntu-latest
    needs: test
    if: |
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/staging' ||
      startsWith(github.ref, 'refs/tags/intelligence-layer-v')
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=match,pattern=intelligence-layer-v(.*),group=1
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/staging' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./intelligence-layer
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
