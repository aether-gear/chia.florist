# Chia Florist — Automated Monorepo CI Versioning & Releases
#
# This workflow directly automates independent monorepo semantic versioning:
#   1. Inspects conventional commits per module path (service-core, e-commerce, control-panel, intelligence-layer).
#   2. Determines independent version bumps per package.
#   3. Cuts Git tags and creates GitHub Releases directly via GitHub API.
#   4. Zero bot-authored commits and zero automated release PRs.
#
# Trigger: Push to main branch

name: Release — Monorepo Versioning

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Independent Monorepo Tag & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Monorepo Release Engine
        run: node .github/scripts/release-monorepo.mjs
        env:
          GH_TOKEN: ${{ secrets.CHIA_CURRENT_ARC || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
