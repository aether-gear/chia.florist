# Chia Florist — Reverse-Proxy Gateway
# Used in: docker-compose (local dev) and monolith scenario
# Subdomains:
#   api.chia.florist   → service-core:7129
#   app.chia.florist   → e-commerce:4000
#   panel.chia.florist → control-panel:80

upstream service_core {
    server service-core:7129;
    keepalive 32;
}

upstream e_commerce {
    server e-commerce:4000;
    keepalive 16;
}

upstream control_panel {
    server control-panel:80;
    keepalive 16;
}

# --- service-core (REST API) --- #
server {
    listen 80;
    server_name api.chia.florist;

    location / {
        proxy_pass         http://service_core;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
    }
}

# --- control-panel (Admin SPA) --- #
server {
    listen 80;
    server_name panel.chia.florist;

    location / {
        proxy_pass         http://control_panel;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";
    }
}

# --- e-commerce (Nuxt SSR storefront) --- #
server {
    listen 80;
    server_name app.chia.florist chia.florist;

    # Forward /api/core/* straight to the Go backend (bypass Nuxt proxy)
    location /api/core/ {
        proxy_pass         http://service_core/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
    }

    # All other traffic → Nuxt SSR
    location / {
        proxy_pass         http://e_commerce;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
    }
}

# --- Fallback (localhost dev) --- #
server {
    listen 80 default_server;
    server_name localhost 127.0.0.1;

    location /api/core/ {
        proxy_pass http://service_core/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    location /panel/ {
        proxy_pass http://control_panel/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://e_commerce;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}