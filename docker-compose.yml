# Chia Florist — Full Local Development Stack
# Usage:
#   docker compose up --build
#
# Subdomains (add to C:\Windows\System32\drivers\etc\hosts):
#   127.0.0.1  app.chia.florist api.chia.florist panel.chia.florist

services:

  # --- PostgreSQL (local dev only) --- #
  postgres:
    image: postgres:17-alpine
    container_name: chia-postgres
    restart: unless-stopped
    env_file:
      - ./service-core/.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB_NAME:-chia_florase}
      POSTGRES_USER: ${POSTGRES_DB_USER:-chiaw}
      POSTGRES_PASSWORD: ${POSTGRES_DB_PASSWORD:-chiaw_florist!810189}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_DB_USER:-chiaw} -d $${POSTGRES_DB_NAME:-chia_florase}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- intelligence-layer (FastAPI AI Server) --- #
  intelligence-layer:
    build:
      context: ./intelligence-layer
      dockerfile: Dockerfile
    image: chia-florist/intelligence-layer:local
    container_name: chia-intelligence-layer
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --- service-core (Go REST API) --- #
  service-core:
    build:
      context: ./service-core
      dockerfile: Dockerfile
    image: chia-florist/service-core:local
    container_name: chia-service-core
    restart: unless-stopped
    env_file:
      - ./service-core/.env
    environment:
      POSTGRES_DB_HOST: postgres
      POSTGRES_DB_PORT: 5432
      MY_APP_SAYA_HOST: 0.0.0.0
      MY_APP_SAYA_PORT: 7129
      INTELLIGENCE_LAYER_BASE_URL: http://intelligence-layer:8000/api/v1
    ports:
      - "7129:7129"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7129/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # --- e-commerce (Nuxt 4 SSR) --- #
  e-commerce:
    build:
      context: ./e-commerce
      dockerfile: Dockerfile
    image: chia-florist/e-commerce:local
    container_name: chia-e-commerce
    restart: unless-stopped
    env_file:
      - ./e-commerce/.env
    environment:
      HOST: 0.0.0.0
      PORT: 4000
      SERVICE_CORE_API_URL: http://service-core:7129
      NUXT_PUBLIC_SERVICE_CORE_API_URL: http://service-core:7129
    ports:
      - "4000:4000"
    depends_on:
      service-core:
        condition: service_healthy

  # --- control-panel (React SPA via nginx) --- #
  control-panel:
    build:
      context: ./control-panel
      dockerfile: Dockerfile
    image: chia-florist/control-panel:local
    container_name: chia-control-panel
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - service-core

  # --- nginx gateway --- #
  nginx:
    image: nginx:1.27-alpine
    container_name: chia-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - service-core
      - e-commerce
      - control-panel

volumes:
  postgres_data:
    name: chia-florist-postgres-data
