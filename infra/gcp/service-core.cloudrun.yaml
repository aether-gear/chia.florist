# Chia Florist — service-core Cloud Run Service Definition
# Deploy:
#   gcloud run services replace infra/gcp/service-core.cloudrun.yaml
#
# Replace IMAGE_URL and set secrets in Secret Manager before deploying.

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: chia-florist-service-core
  labels:
    app: chia-florist
    module: service-core
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 100
      timeoutSeconds: 60
      containers:
        - image: IMAGE_URL   # e.g. asia-southeast1-docker.pkg.dev/PROJECT/chia-florist/service-core:latest
          ports:
            - containerPort: 7129
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: MY_APP_SAYA_HOST
              value: "0.0.0.0"
            - name: MY_APP_SAYA_PORT
              value: "7129"
            - name: APP_ENV
              value: production
            - name: POSTGRES_DB_SSLMODE
              value: disable
            - name: SMTP_PORT
              value: "587"
          envFrom: []
          # Secrets from GCP Secret Manager
          volumeMounts:
            - name: secrets
              mountPath: /etc/secrets
              readOnly: true
      volumes:
        - name: secrets
          secret:
            secretName: chia-florist-secrets
            items:
              - key: JWT_SECRET
                path: JWT_SECRET