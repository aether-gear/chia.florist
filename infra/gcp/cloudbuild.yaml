# Chia Florist — Google Cloud Build Config
# Builds all three module images and pushes to Artifact Registry.
#
# Substitution variables (set in Cloud Build trigger):
#   _PROJECT_ID    — GCP project ID
#   _REGION        — Artifact Registry region (e.g. asia-southeast1)
#   _REPO          — Artifact Registry repo name (e.g. chia-florist)
#   _IMAGE_TAG     — defaults to $SHORT_SHA

substitutions:
  _PROJECT_ID: my-gcp-project
  _REGION:     asia-southeast1
  _REPO:       chia-florist
  _IMAGE_TAG:  $SHORT_SHA

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

steps:

  # --- Build service-core --- #
  - name: gcr.io/cloud-builders/docker
    id: build-service-core
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/service-core:${_IMAGE_TAG}
      - --tag
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/service-core:latest
      - --cache-from
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/service-core:latest
      - --file
      - service-core/Dockerfile
      - service-core
    waitFor: ['-']

  # --- Build e-commerce --- #
  - name: gcr.io/cloud-builders/docker
    id: build-e-commerce
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/e-commerce:${_IMAGE_TAG}
      - --tag
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/e-commerce:latest
      - --cache-from
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/e-commerce:latest
      - --file
      - e-commerce/Dockerfile
      - e-commerce
    waitFor: ['-']

  # --- Build control-panel --- #
  - name: gcr.io/cloud-builders/docker
    id: build-control-panel
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/control-panel:${_IMAGE_TAG}
      - --tag
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/control-panel:latest
      - --cache-from
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/control-panel:latest
      - --file
      - control-panel/Dockerfile
      - control-panel
    waitFor: ['-']

  # --- Push all images --- #
  - name: gcr.io/cloud-builders/docker
    id: push-service-core
    args: [push, --all-tags, ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/service-core]
    waitFor: [build-service-core]

  - name: gcr.io/cloud-builders/docker
    id: push-e-commerce
    args: [push, --all-tags, ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/e-commerce]
    waitFor: [build-e-commerce]

  - name: gcr.io/cloud-builders/docker
    id: push-control-panel
    args: [push, --all-tags, ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/control-panel]
    waitFor: [build-control-panel]

  # --- Deploy service-core to Cloud Run --- #
  - name: gcr.io/cloud-builders/gcloud
    id: deploy-service-core
    args:
      - run
      - deploy
      - chia-florist-service-core
      - --image=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/service-core:${_IMAGE_TAG}
      - --region=${_REGION}
      - --platform=managed
    waitFor: [push-service-core]

  # --- Deploy e-commerce to Cloud Run --- #
  - name: gcr.io/cloud-builders/gcloud
    id: deploy-e-commerce
    args:
      - run
      - deploy
      - chia-florist-e-commerce
      - --image=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/e-commerce:${_IMAGE_TAG}
      - --region=${_REGION}
      - --platform=managed
    waitFor: [push-e-commerce]

  # --- Deploy control-panel to Cloud Run --- #
  - name: gcr.io/cloud-builders/gcloud
    id: deploy-control-panel
    args:
      - run
      - deploy
      - chia-florist-control-panel
      - --image=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/control-panel:${_IMAGE_TAG}
      - --region=${_REGION}
      - --platform=managed
    waitFor: [push-control-panel]

images:
  - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/service-core:${_IMAGE_TAG}
  - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/e-commerce:${_IMAGE_TAG}
  - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/control-panel:${_IMAGE_TAG}