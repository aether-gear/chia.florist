# Chia Florist — Monolith / Single-Container Scenario
#
# All three apps are run behind a single nginx container.
# service-core binary is run as a background process via a supervisord-like
# init script, and nginx serves e-commerce (via proxy) and control-panel
# (as static files).
#
# Usage:
#   docker compose -f docker-compose.monolith.yml --env-file .env.compose up --build
#
# NOTE: This is for simple deployments (e.g., single VPS/EC2 instance).
#       For production microservices, use docker-compose.yml.

services:

  # --- Single PostgreSQL instance --- #
  postgres:
    image: postgres:17-alpine
    container_name: chia-mono-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB_NAME:-chia_florase}
      POSTGRES_USER:     ${POSTGRES_DB_USER:-chiaw}
      POSTGRES_PASSWORD: ${POSTGRES_DB_PASSWORD:-chiaw_dev_pass}
    volumes:
      - postgres_monolith_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_DB_USER:-chiaw}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- service-core API --- #
  service-core:
    build:
      context: ./service-core
      dockerfile: Dockerfile
    container_name: chia-mono-api
    restart: unless-stopped
    environment:
      MY_APP_SAYA_HOST:    0.0.0.0
      MY_APP_SAYA_PORT:    7129
      APP_ENV:             production
      POSTGRES_DB_HOST:    postgres
      POSTGRES_DB_PORT:    5432
      POSTGRES_DB_NAME:    ${POSTGRES_DB_NAME:-chia_florase}
      POSTGRES_DB_USER:    ${POSTGRES_DB_USER:-chiaw}
      POSTGRES_DB_PASSWORD: ${POSTGRES_DB_PASSWORD:-chiaw_dev_pass}
      POSTGRES_DB_SSLMODE: disable
      JWT_SECRET:          ${JWT_SECRET}
      SUPABASE_PROJECT_URL:      ${SUPABASE_PROJECT_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    expose:
      - "7129"
    depends_on:
      postgres:
        condition: service_healthy

  # --- e-commerce SSR --- #
  e-commerce:
    build:
      context: ./e-commerce
      dockerfile: Dockerfile
    container_name: chia-mono-storefront
    restart: unless-stopped
    environment:
      HOST:                 0.0.0.0
      PORT:                 4000
      SERVICE_CORE_API_URL: http://service-core:7129
      SUPABASE_URL:         ${SUPABASE_PROJECT_URL}
      SUPABASE_KEY:         ${SUPABASE_SERVICE_ROLE_KEY}
    expose:
      - "4000"
    depends_on:
      - service-core

  # --- control-panel static --- #
  control-panel:
    build:
      context: ./control-panel
      dockerfile: Dockerfile
      args:
        - VITE_WAF_API_URL=/api/waf
    container_name: chia-mono-panel
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - service-core

  # --- nginx — single public entry point --- #
  nginx:
    image: nginx:1.27-alpine
    container_name: chia-mono-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - service-core
      - e-commerce
      - control-panel

volumes:
  postgres_monolith_data:
    name: chia-florist-monolith-postgres-data
    