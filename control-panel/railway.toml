# Chia Florist — control-panel Railway Config
# NOTE: Primary deployment is Netlify (static site).
#       This file is provided as an ALTERNATIVE if you prefer Railway hosting.
#
# Required Build Args (set as Railway variables):
#   VITE_API_BASE_URL — e.g. https://api.chia.florist

[build]
builder        = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath        = "/"
healthcheckTimeout     = 60
restartPolicyType      = "ON_FAILURE"
restartPolicyMaxRetries = 3
numReplicas            = 1